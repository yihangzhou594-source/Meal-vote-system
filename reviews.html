<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>干饭报名 - 评价反馈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #2c3e50;
            --accent-color: #bfa05f;
            --secondary-color: #9a2323;
            --medical-red: #ff5e5e; /* Medical Support Red */
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            
            /* Assets */
            --header-bg-img: url('https://app.trickle.so/storage/public/images/usr_1a810ecaf8000001/529b0f07-0509-4e85-9d30-6d7e20b05895.jpeg');
            --bg-pattern: url('https://app.trickle.so/storage/public/images/usr_1a810ecaf8000001/26873dce-e827-4fa9-85d1-05560d2234be.jpeg');
        }
    }

    @layer base {
        body {
            @apply bg-[var(--bg-color)] text-[var(--text-main)] antialiased;
            font-family: "Noto Serif SC", serif;
            background-image: 
                linear-gradient(rgba(252, 252, 252, 0.95), rgba(252, 252, 252, 0.95)),
                var(--bg-pattern);
            background-attachment: fixed;
            background-size: cover;
        }
        h1, h2, h3, h4, h5, h6,
            p, div, span, label, li, a,
            .card, .label, .btn, .input-field {
            font-family: "Noto Serif SC", serif;
            font-weight: 700;
        }
    }

    @layer components {
        .card {
            @apply bg-[var(--card-bg)] rounded-sm p-4 md:p-6 mb-4 md:mb-6 relative border border-gray-100 shadow-sm;
        }
        .card::before {
            content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='4' viewBox='0 0 20 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 4h20v-2h-2v2h-2v-2h-2v2h-2v-2h-2v2h-2v-2H6v2H4v-2H2v2H0z' fill='%231e293b' fill-opacity='0.1'/%3E%3C/svg%3E");
            opacity: 0.5;
        }
        .btn {
            @apply px-6 py-2 rounded-sm font-medium transition-all duration-300 flex items-center justify-center gap-2 tracking-wide shadow-sm active:scale-95 cursor-pointer;
        }
        .btn-primary {
            @apply bg-[var(--primary-color)] text-[#f8f8f8] border-2 border-[var(--primary-color)] hover:bg-[#1a2633];
        }
        .btn-outline {
            @apply border border-gray-300 bg-white text-gray-700 hover:bg-gray-50;
        }
        .input-field {
            @apply w-full px-4 py-3 bg-gray-50 border border-gray-200 focus:border-[var(--primary-color)] outline-none transition-all rounded-sm;
        }
    }
    @layer utilities {
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .review-card { padding: 1rem; font-size: 0.9rem; }
            .edit-btn, .delete-btn { width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; }
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="utils/db.js"></script>
    <script type="text/babel" src="utils/helpers.js"></script>
    <script type="text/babel" src="components/Alert.js"></script>
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/Layout.js"></script>
    <script type="text/babel" src="reviews-app.js"></script>
</body>
</html>
