    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #2c3e50; /* Deep Ink Blue */
            --accent-color: #bfa05f;  /* Muted Gold */
            --secondary-color: #9a2323; /* Seal Red */
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #555555;
            
            /* Assets */
            --header-bg-img: url('https://app.trickle.so/storage/public/images/usr_1a810ecaf8000001/529b0f07-0509-4e85-9d30-6d7e20b05895.jpeg');
            --mascot-img: url('https://app.trickle.so/storage/public/images/usr_1a810ecaf8000001/c0921e22-7519-441a-b085-149eaedd50d8.png');
            --bg-pattern: url('https://app.trickle.so/storage/public/images/usr_1a810ecaf8000001/26873dce-e827-4fa9-85d1-05560d2234be.jpeg');
        }
    }

    @layer base {
        body {
            @apply bg-[var(--bg-color)] text-[var(--text-main)] antialiased;
            font-family: "Noto Serif SC", serif;
            background-image: 
                linear-gradient(rgba(252, 252, 252, 0.95), rgba(252, 252, 252, 0.95)),
                var(--bg-pattern);
            background-attachment: fixed;
            background-size: cover;
        }
        h1, h2, h3, h4, h5, h6,
            p, div, span, label, li, a,
            .card, .label, .btn, .input-field {
            font-family: "Noto Serif SC", serif;
            font-weight: 700;
        }
    }
    
    @layer components {
        .card {
            @apply bg-[var(--card-bg)] rounded-sm p-4 md:p-6 mb-4 md:mb-6 relative border border-gray-100 shadow-sm;
        }
        /* Fret Pattern Border Top/Bottom */
        .card::before, .card::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='4' viewBox='0 0 20 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 4h20v-2h-2v2h-2v-2h-2v2h-2v-2h-2v2h-2v-2H6v2H4v-2H2v2H0z' fill='%231e293b' fill-opacity='0.1'/%3E%3C/svg%3E");
            opacity: 0.5;
        }
        .card::before { top: 0; }
        .card::after { bottom: 0; transform: rotate(180deg); }

        .stat-value { @apply text-3xl font-bold text-[var(--primary-color)]; }
        .stat-label { @apply text-sm text-gray-500 uppercase tracking-wide font-bold; }
    }

    @layer utilities {
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    }
    </style>
