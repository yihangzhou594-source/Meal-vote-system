    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #2c3e50; /* Deep Ink Blue */
            --accent-color: #bfa05f;  /* Muted Gold */
            --secondary-color: #9a2323; /* Seal Red */

            --text-main: #1a1a1a;

    }

    @layer base {
        body {
            @apply bg-[var(--bg-color)] text-[var(--text-main)] antialiased;
            font-family: "Noto Serif SC", serif;
            background-image: 
                linear-gradient(rgba(252, 252, 252, 0.95), rgba(252, 252, 252, 0.95)),
                var(--bg-pattern);
            background-attachment: fixed;
            background-size: cover;
        }
          h1, h2, h3, h4, h5, h6,
            p, div, span, label, li, a,

            font-family: "Noto Serif SC", serif;

    }

    @layer components {
        .btn {
            @apply px-6 py-3 rounded-sm font-medium transition-all duration-300 flex items-center justify-center gap-2 tracking-wide shadow-sm active:scale-95;
        }
        /* High Contrast Primary Button */
        .btn-primary {
            @apply bg-[var(--primary-color)] text-[#f8f8f8] border-2 border-[var(--primary-color)]
            hover:bg-[#1a2633] hover:border-[#1a2633] hover:shadow-lg hover:text-white
            disabled:opacity-50 disabled:cursor-not-allowed;
        }
        .input-field {
            @apply w-full px-4 py-3 bg-transparent border-b-2 border-gray-300 focus:border-[var(--primary-color)] outline-none transition-all rounded-none placeholder-gray-400;
        }
        .label {
            @apply block text-base font-bold text-[var(--primary-color)] mb-2 tracking-widest font-serif;
        }
        .card {
            @apply bg-[var(--card-bg)] rounded-sm p-5 md:p-8 mb-6 md:mb-8 relative border border-gray-100 shadow-sm;
        }
        /* Fret Pattern Border Top/Bottom */
        .card::before, .card::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='4' viewBox='0 0 20 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 4h20v-2h-2v2h-2v-2h-2v2h-2v-2h-2v2h-2v-2H6v2H4v-2H2v2H0z' fill='%231e293b' fill-opacity='0.1'/%3E%3C/svg%3E");
            opacity: 0.5;
        }
        .card::before { top: 0; }
        .card::after { bottom: 0; transform: rotate(180deg); }

        .radio-card {
            @apply border border-gray-200 bg-white p-5 cursor-pointer hover:border-[var(--primary-color)] hover:shadow-md transition-all flex items-center justify-between relative;
        }
        .radio-card.selected {
            @apply border-[var(--primary-color)] bg-indigo-50/30 ring-1 ring-[var(--primary-color)];
        }
        /* Seal Style for Selected */
        .seal-mark {
            @apply absolute right-2 bottom-2 w-8 h-8 border-2 border-[var(--secondary-color)] text-[var(--secondary-color)] rounded-sm flex items-center justify-center text-xs font-bold transform -rotate-12 opacity-80;
            box-shadow: inset 0 0 0 1px var(--secondary-color);
        }
    }
    @layer utilities {
        .animate-bounce-slight {
            animation: bounce-slight 2s infinite;
        }
        @keyframes bounce-slight {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
